name: Build TPFanController

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TPFanController
        run: |
          msbuild fancontrol\fancontrol.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Find compiled files
        shell: powershell
        run: |
          Write-Host "Executáveis encontrados:"
          Get-ChildItem -Path . -Recurse -Filter *.exe |
          Select-Object FullName

          Write-Host "Ficheiros INI encontrados:"
          Get-ChildItem -Path . -Recurse -Filter *.ini |
          Select-Object FullName

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact

          $exe = Get-ChildItem -Path . -Recurse -Filter fancontrol.exe |
                 Select-Object -First 1

          if (-not $exe) {
              throw "fancontrol.exe não foi encontrado"
          }

          Copy-Item $exe.FullName artifact\fancontrol.exe

          $ini = Get-ChildItem -Path . -Recurse -Filter TPFanControl.ini |
                 Select-Object -First 1

          if ($ini) {
              Copy-Item $ini.FullName artifact\TPFanControl.ini
          }

          Write-Host "Conteúdo final:"
          Get-ChildItem artifact

      - name: Upload compiled program
        uses: actions/upload-artifact@v4
        with:
          name: TPFanController-Win32
          path: artifact
