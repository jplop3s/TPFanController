name: Build TPFanController

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TPFanController
        run: |
          msbuild fancontrol\fancontrol.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Show generated files
        shell: powershell
        run: |
          Write-Host "Conteudo da pasta Release:"
          Get-ChildItem -Path "fancontrol\Release" -Recurse

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact

          Copy-Item "fancontrol\Release\TPFanControl.exe" "artifact\TPFanControl.exe"

          if (Test-Path "fancontrol\Release\TPFanControl.ini") {
              Copy-Item "fancontrol\Release\TPFanControl.ini" "artifact\TPFanControl.ini"
          }
          elseif (Test-Path "fancontrol\TPFanControl.ini") {
              Copy-Item "fancontrol\TPFanControl.ini" "artifact\TPFanControl.ini"
          }

          Write-Host "Ficheiros finais:"
          Get-ChildItem artifact

      - name: Upload compiled program
        uses: actions/upload-artifact@v4
        with:
          name: TPFanController-Win32
          path: artifact
